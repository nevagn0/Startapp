services:

  jilo-frontend:
    image: jilo-frontend
    build:
      context: ./jilo-frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - jilo.app
    networks:
      - default

  jilo.app:
    image: ${DOCKER_REGISTRY-}jiloapp
    build:
      context: .
      dockerfile: Jilo.App/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__PostgresDatabase=Host=postgres-db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - JwtOptions__Audience=${JWT_AUDIENCE}
      - JwtOptions__Issuer=${JWT_ISSUER}
      - JwtOptions__Key=${JWT_KEY}
      - JwtOptions__AccessTokenLifetimeSeconds=${JWT_ACCESS_TOKEN_LIFETIME}
    ports:
      - "8080:8080"
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - default
  

  postgres-db:
    image: postgres:18
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql
    ports:
      - "5432:5432" 
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - default

volumes:
  postgres-data:
  
networks:
  default:
    driver: bridge