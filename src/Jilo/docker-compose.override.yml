services:
  jilo.app:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_HTTPS_PORTS=8081
      - ConnectionStrings__PostgresDatabase=Host=postgres-db;Port=5432;Database=jilo;Username=Developer;Password=Developer123!
      - JwtOptions__Audience=Jilo.App
      - JwtOptions__Issuer=AuthService
      - JwtOptions__Key=12389e6ruh4378refas34trgudisaghv78rfg8745whfgrewkjdgfh3489q0ter
      - JwtOptions__AccessTokenLifetimeSeconds=300
 
    ports:
      - "8080:8080"
      - "8081:8081"
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
      - ${APPDATA}/Microsoft/UserSecrets:/root/.microsoft/usersecrets:ro
      - ${APPDATA}/ASP.NET/Https:/home/app/.aspnet/https:ro
      - ${APPDATA}/ASP.NET/Https:/root/.aspnet/https:ro
    depends_on:
      postgres-db:
        condition: service_healthy
  
  postgres-db:
    environment:
      - POSTGRES_USER=Developer
      - POSTGRES_PASSWORD=Developer123!
      - POSTGRES_DB=jilo
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U Developer -d jilo"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres-data:
     